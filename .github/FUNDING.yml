# Shown as a "Sponsor" button at the top of the repository.
#
# ko_fi is the handle after ko-fi.com/ — ko-fi.com/edmozley.
#
# `github: edmozley` can be added here once GitHub Sponsors is approved, which
# is a separate application on GitHub's side. It is deliberately left out until
