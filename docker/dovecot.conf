# Dovecot configuration for IMAP/POP3 testing

protocols = imap pop3
listen = *, ::

# Authentication
disable_plaintext_auth = no
auth_mechanisms = plain login

# Mail storage
mail_location = mbox:~/mail:INBOX=/var/mail/inbox
mailbox_list_index = yes

# Security (relaxed for development/testing)
ssl = no

# IMAP settings
imap_client_workarounds = tb-extra-mailbox-sep

# POP3 settings  
pop3_uidl_format = %08Xu%08Xv

# Logging
log_path = /dev/stdout
info_log_path = /dev/stdout
debug = yes

# Enable mail_log plugin to log operations
mail_plugins = quota mail_log

plugin {
  mail_log_events = delete undelete expunge copy mailbox_delete mailbox_rename
  mail_log_object = uid box msgid size
}

# Service config
service imap-login {
  inet_listener imap {
    port = 143
  }
  inet_listener imaps {
    port = 993
    ssl = no
  }
}

service pop3-login {
  inet_listener pop3 {
    port = 110
  }
  inet_listener pop3s {
    port = 995
    ssl = no
  }
}

# User database (basic for testing)
userdb {
  driver = static
  args = uid=mail gid=mail home=/var/mail/%u
}

passdb {
  driver = static
  args = password=testpass123
}
