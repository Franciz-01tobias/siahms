dovecot_config_version = 2.4.5

protocols = imap pop3
listen = *, ::

auth_mechanisms = plain login

mail_location = mbox:~/mail:INBOX=~/INBOX
mail_home = /var/mail/%u

ssl = no

service imap-login {
  inet_listener imap {
    port = 143
  }
}

service pop3-login {
  inet_listener pop3 {
    port = 110
  }
}

userdb {
  driver = static
  args = uid=mail gid=mail home=/var/mail/%u
}

passdb {
  driver = static
  args = password={PLAIN}testpass123
}
